<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="EIM JSEA">
<meta name="theme-color" content="#1b2f6e">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<title>EIM Digital JSEA</title>
<style>
:root{--navy:#1b2f6e;--blue:#2f5fd0;--ink:#1c2230;--mute:#667085;--line:#d9dee8;--bg:#f3f5f9;--card:#fff;--ok:#0a8a4a;--warn:#b25e00;--err:#c62828;
  --r-stop:#ff2b2b;--r-urgent:#f6b58a;--r-action:#ffee33;--r-monitor:#92d050;--r-ok:#27ae60}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;-webkit-text-size-adjust:100%}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
h1,h2,h3{margin:0;color:var(--navy)}
h1{font-size:20px}h2{font-size:17px}h3{font-size:15px}
.wrap{max-width:760px;margin:0 auto;padding:12px 12px 96px}
.wide{max-width:1180px}
.top{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;padding:9px 12px}
.top .row{display:flex;align-items:center;gap:8px;max-width:1180px;margin:0 auto}
.top .t{flex:1;min-width:0}
.top .t b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .t span{display:block;font-size:12px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:10px;height:10px;border-radius:50%;background:#6ee7a0;flex:none}
.dot.busy{background:#ffd166}.dot.off{background:#ff6b6b}
.av{display:flex}.av i{font-style:normal;width:26px;height:26px;border-radius:50%;background:#fff;color:var(--navy);font-size:11px;font-weight:700;display:grid;place-items:center;margin-left:-6px;border:2px solid var(--navy)}
.av i.off{opacity:.45}
.tabs{display:flex;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:50px;z-index:19;overflow-x:auto}
.tabs button{flex:1;border:0;background:none;padding:10px 6px;font-size:13px;font-weight:600;color:var(--mute);border-bottom:3px solid transparent;white-space:nowrap;position:relative}
.tabs button.on{color:var(--navy);border-bottom-color:var(--blue)}
.tabs button em{font-style:normal;display:inline-block;min-width:17px;height:17px;line-height:17px;border-radius:9px;background:var(--err);color:#fff;font-size:11px;margin-left:4px;padding:0 4px}
.tabs button em.done{background:var(--ok)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:12px 0}
.card>h2{margin-bottom:8px}
label,.lab{display:block;font-size:12.5px;font-weight:600;color:var(--mute);margin:10px 0 4px}
input[type=text],input[type=email],input[type=tel],input[type=password],textarea,select{width:100%;border:1px solid #c5ccd9;border-radius:9px;padding:10px 11px;background:#fff;font-size:16px}
textarea{resize:none;overflow:hidden;min-height:44px;line-height:1.35}
input:focus,textarea:focus,select:focus{outline:2px solid var(--blue);outline-offset:0;border-color:var(--blue)}
.hint{font-size:12.5px;color:var(--mute);margin:4px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{border:0;border-radius:10px;padding:12px 16px;font-weight:700;background:var(--blue);color:#fff;min-height:46px}
.btn.block{display:block;width:100%}
.btn.ghost{background:#fff;color:var(--navy);border:1.5px solid #b9c2d6}
.btn.ok{background:var(--ok)}.btn.err{background:var(--err)}
.btn.small{padding:7px 11px;min-height:34px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.45}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:9px 12px calc(9px + env(safe-area-inset-bottom));display:flex;gap:8px;z-index:18;justify-content:center}
.bar .btn{flex:1;max-width:360px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1.5px solid #b9c2d6;background:#fff;border-radius:20px;padding:8px 12px;font-size:14px}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.q{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #edf0f5}
.q:last-child{border-bottom:0}
.q .txt{flex:1;font-size:14.5px}.q .txt b{display:block;color:var(--err);font-size:13.5px}.q .txt small{color:var(--mute);font-size:12.5px;display:block}
.q.miss .txt::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--err);margin-right:6px}
.seg{display:flex;border:1.5px solid #b9c2d6;border-radius:9px;overflow:hidden;flex:none}
.seg button{border:0;background:#fff;padding:9px 13px;font-weight:700;font-size:14px;min-width:46px}
.seg button+button{border-left:1.5px solid #b9c2d6}
.seg button.on{background:var(--navy);color:#fff}
.step{background:#fff;border:1px solid var(--line);border-radius:12px;margin:12px 0;overflow:hidden}
.step.bad{border-color:#e9a3a3}
.step-h{display:flex;gap:8px;align-items:flex-start;background:#eef2fb;padding:10px}
.num{flex:none;width:30px;height:30px;border-radius:50%;background:var(--navy);color:#fff;font-weight:700;display:grid;place-items:center;margin-top:6px}
.step-h textarea{flex:1;font-weight:600}
.icon{border:0;background:none;font-size:22px;line-height:1;padding:8px 6px;color:var(--navy);flex:none}
.step-b{padding:4px 12px 12px}
.haz{border-top:1px dashed var(--line);padding:8px 0 10px}
.haz:first-child{border-top:0}
.rr{display:flex;gap:8px;margin-top:8px}
.risk{flex:1;border:1.5px solid #b9c2d6;border-radius:10px;background:#fff;padding:7px 10px;text-align:left;font-size:12.5px;color:var(--mute);display:flex;align-items:center;justify-content:space-between;min-height:48px}
.risk b{font-size:19px;color:#000;min-width:44px;text-align:center;border-radius:8px;padding:3px 6px;background:#eef0f4}
.r-stop{background:var(--r-stop)!important;color:#fff!important}.r-urgent{background:var(--r-urgent)!important}.r-action{background:var(--r-action)!important}.r-monitor{background:var(--r-monitor)!important}.r-ok{background:var(--r-ok)!important;color:#fff!important}
.link{border:0;background:none;color:var(--blue);font-weight:600;padding:8px 0;font-size:14px}
.link.red{color:var(--err)}
.addstep{display:block;width:100%;border:1.5px dashed #9fb0d6;background:#f7f9ff;color:var(--blue);border-radius:10px;padding:9px;font-weight:700;font-size:14px;margin:8px 0}
.status{display:inline-block;border-radius:20px;padding:3px 10px;font-size:12px;font-weight:700;background:#e7ebf3;color:var(--navy);white-space:nowrap}
.status.review{background:#fff1cc;color:#7a5200}.status.approval{background:#dce8ff;color:#1b3fa0}.status.approved{background:#d6f3e2;color:#0a6b3a}.status.draft{background:#e7ebf3}.status.returned{background:#fde0e0;color:#a31515}
.note{border-radius:12px;padding:12px 14px;margin:12px 0;font-size:14.5px}
.note.ret{background:#fff0f0;border:1.5px solid #f0b4b4}.note.info{background:#eef4ff;border:1.5px solid #bcd0f7}.note.good{background:#e9f8ef;border:1.5px solid #a9dbbd}.note.warn{background:#fff7e6;border:1.5px solid #f1cf8d}
.note b{display:block;margin-bottom:3px}
.issues{list-style:none;margin:6px 0;padding:0}
.issues li{padding:7px 0 7px 22px;border-bottom:1px solid #edf0f5;font-size:14px;position:relative}
.issues li::before{content:"!";position:absolute;left:0;top:7px;width:16px;height:16px;border-radius:50%;background:var(--err);color:#fff;font-size:11px;font-weight:700;text-align:center;line-height:16px}
.issues li.warn::before{background:var(--warn)}
.issues li[data-act]{cursor:pointer}
.crew{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #edf0f5}
.crew .n{flex:1;min-width:0}.crew .n small{display:block;color:var(--mute);font-size:12.5px}
.sig{width:110px;height:36px;flex:none}.sig svg{width:100%;height:100%}
.tag{font-size:11px;font-weight:700;border-radius:6px;padding:2px 6px;background:#e7ebf3;color:var(--navy);margin-left:6px}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:620px;border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-height:94vh;overflow:auto}
@media(min-width:700px){.modal{align-items:center}.sheet{border-radius:16px}}
.sheet h2{margin-bottom:6px}
.sheet .acts{display:flex;gap:8px;margin-top:14px}.sheet .acts .btn{flex:1}
.menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:14px 4px;border-bottom:1px solid #edf0f5;font-size:16px}
.menu button.red{color:var(--err)}
.pad{border:2px dashed #9aa7c2;border-radius:12px;background:#fbfcff;touch-action:none;width:100%;display:block}
.mx{display:grid;grid-template-columns:auto repeat(5,1fr);gap:4px;font-size:12px;margin-top:8px}
.mx div{display:grid;place-items:center;text-align:center;min-height:44px;border-radius:7px}
.mx .lab2{font-size:11px;color:var(--ink);padding:0 4px;justify-items:end;text-align:right;min-width:74px}
.mx .cl{font-size:10.5px;min-height:30px;align-items:start}
.mx button{border:0;border-radius:7px;font-weight:800;font-size:17px;min-height:44px;color:#000}
.mx button.sel{outline:3px solid #000;outline-offset:1px}
.legend{font-size:12.5px;margin-top:10px;display:grid;grid-template-columns:auto 1fr;gap:4px 8px;align-items:center}
.legend i{display:inline-block;width:38px;height:18px;border-radius:4px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;background:#111827;color:#fff;border-radius:10px;padding:10px 14px;font-size:14px;z-index:80;max-width:92vw;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.toast.err{background:#a31515}.toast.good{background:#0a6b3a}
table.sum{width:100%;min-width:640px;border-collapse:collapse;font-size:13.5px}
table.sum th,table.sum td{border:1px solid var(--line);padding:6px 7px;vertical-align:top;text-align:left}
table.sum th{background:#eef2fb;font-size:12px}
table.sum td.c{text-align:center;font-weight:800}
table.sum ul{margin:0;padding-left:16px}
table.sum tr.w td{background:#fff9ec}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:14px}.kv b{color:var(--mute);font-weight:600}
.hist{font-size:12.5px;color:var(--mute)}.hist div{padding:3px 0;border-bottom:1px solid #f0f2f6}
.big{font-size:44px;font-weight:800;letter-spacing:6px;color:var(--navy);text-align:center}
.center{text-align:center}
.qr svg{width:100%;height:auto;max-width:340px;display:block;margin:0 auto}
.cols{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:900px){.cols{grid-template-columns:360px 1fr}}
.jrow{display:flex;align-items:center;gap:10px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;margin:8px 0;background:#fff;cursor:pointer;width:100%;text-align:left}
.jrow.todo{border-color:var(--blue);box-shadow:0 0 0 2px #dce8ff}
.jrow .n{flex:1;min-width:0}.jrow .n small{display:block;color:var(--mute);font-size:12.5px}
.proj{position:fixed;inset:0;background:#fff;z-index:90;display:flex;gap:4vw;align-items:center;justify-content:center;padding:3vw}
.proj .qr{flex:0 0 min(46vw,80vh)}.proj .qr svg{max-width:none}
.proj h1{font-size:4vw}.proj p{font-size:2vw;margin:.6em 0}.proj .big{font-size:6vw;text-align:left}
.proj .x{position:absolute;top:14px;right:18px}
.spin{display:inline-block;width:18px;height:18px;border:3px solid #c9d3ea;border-top-color:var(--blue);border-radius:50%;animation:sp 1s linear infinite;vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}
@media print{.top,.bar,.tabs{display:none}}

.xsteps{list-style:none;margin:4px 0 8px;padding:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.xsteps li{display:flex;align-items:flex-start;gap:8px;padding:7px 8px;border-top:1px solid var(--line)}
.xsteps li:first-child{border-top:0}.xsteps li:nth-child(even){background:#f7f9fc}
.xsteps .xn{flex:0 0 26px;height:26px;margin-top:5px;border-radius:50%;background:var(--navy);color:#fff;font-size:12.5px;font-weight:700;display:flex;align-items:center;justify-content:center}
.xsteps textarea{flex:1;min-width:0;min-height:36px;padding:7px 9px;font-size:14px;border:1px solid transparent;background:transparent;border-radius:8px}
.xsteps textarea:hover{border-color:var(--line)}.xsteps textarea:focus{border-color:var(--blue);background:#fff;outline:0}
.xsteps .xb{display:flex;gap:2px;margin-top:3px;flex:0 0 auto}
.xsteps .xb button{width:30px;height:30px;border:0;border-radius:7px;background:none;color:var(--mute);font-size:16px;line-height:1}
.xsteps .xb button:hover:not(:disabled){background:#e6ebf5;color:var(--navy)}.xsteps .xb button:disabled{opacity:.25}
.xsteps .xb button[data-x=del]:hover{background:#fde8e8;color:var(--err)}
@media(max-width:520px){.xsteps .xb button[data-x=up],.xsteps .xb button[data-x=dn]{display:none}}
.who{text-align:center;font-size:12.5px;color:var(--mute);margin:18px 0 6px}

/* ------------------------------------------------------------------ screen size
   The layout follows the width of the window: phone, tablet, then desktop from 960px.
   A phone set to "Desktop site" reports about 980px, so it gets the desktop layout, as asked for.
   Pinch-zoom is allowed everywhere. */
label,.lab,.hint,.who,.q .txt small,.jrow .n small,.crew .n small,.hist{font-size:13px}
.tag,.av i{font-size:11.5px}
@media(max-width:480px){.grid2{grid-template-columns:1fr}}       /* one column on a phone, so long values are not cut off */
@media(pointer:coarse){input[type=text],input[type=email],input[type=tel],input[type=password],textarea,select,.xsteps textarea{font-size:16px}}   /* stops iOS zooming in on a field */
@media(max-width:520px){
  .mx{font-size:12.5px}.mx .lab2{font-size:11.5px;min-width:64px}.mx .cl{font-size:11px}
  .tabs button{font-size:13.5px;padding:11px 6px}
  .risk{font-size:13px}
}
@media(min-width:700px){
  .wrap{max-width:820px;padding:16px 16px 96px}
  .top{padding:11px 16px}.top .t b{font-size:16px}.top .t span{font-size:13px}
  .tabs{justify-content:center;top:56px}.tabs button{flex:0 1 170px;font-size:14.5px;padding:12px 8px}
  .chip{font-size:15px}.q .txt{font-size:15.5px}.q .txt b{font-size:14px}
}
@media(min-width:960px){
  .wrap,.wide{max-width:1180px}
  .wrap{padding:18px 24px 100px}
  .top .row,.tabs{max-width:none}
  .card{padding:18px}
  /* Details and PPE: cards side by side */
  #main[data-tab=details],#main[data-tab=checks]{columns:2;column-gap:16px}
  #main[data-tab=details]>*,#main[data-tab=checks]>*{break-inside:avoid;margin-top:0;margin-bottom:16px}
  #main[data-tab=details]>.note,#main[data-tab=checks]>.note,#main[data-tab=details]>.who,#main[data-tab=checks]>.who{column-span:all}
  /* Potential hazards: two columns of questions */
  #main[data-tab=hazards]>.card{display:grid;grid-template-columns:1fr 1fr;column-gap:36px}
  #main[data-tab=hazards]>.card>:not(.q){grid-column:1/-1}
  #main[data-tab=hazards]>.card>.q:last-of-type,#main[data-tab=hazards]>.card>.q:nth-last-of-type(2){border-bottom:0}
  /* Job steps: the step on the left, its hazards laid out like the form's table on the right */
  #main[data-tab=steps] .step-b{padding:8px 16px 14px}
  #main[data-tab=steps] .haz{display:grid;grid-template-columns:1fr 1.25fr 190px;gap:2px 12px;align-items:start}
  #main[data-tab=steps] .haz>:nth-child(1){grid-area:1/1}#main[data-tab=steps] .haz>:nth-child(2){grid-area:2/1}
  #main[data-tab=steps] .haz>:nth-child(3){grid-area:1/2}#main[data-tab=steps] .haz>:nth-child(4){grid-area:2/2}
  #main[data-tab=steps] .haz>:nth-child(5){grid-area:2/3;grid-template-columns:1fr;gap:6px;margin-top:0}
  #main[data-tab=steps] .haz>:nth-child(6){grid-area:3/1/3/-1;justify-self:start}
  #main[data-tab=steps] .haz .arr{display:none}
  #main[data-tab=steps] .haz label{margin-top:4px}
  .bar{padding-left:24px;padding-right:24px}.bar .btn{max-width:300px}
  table.sum{font-size:14.5px}table.sum th{font-size:13px}
}
.btn.ghost.danger{color:var(--err);border-color:#e9a3a3}.btn.ghost.danger:hover{background:#fff0f0}
.cfm p{margin:8px 0;font-size:15.5px}.cfm{margin-bottom:6px}

/* waiting indicator */
#pbar{position:fixed;left:0;right:0;top:0;height:3px;z-index:90;overflow:hidden;pointer-events:none;display:none;background:rgba(255,255,255,.35)}
#pbar i{position:absolute;top:0;bottom:0;width:35%;left:-35%;background:#6ea0ff}
body.waiting #pbar{display:block}body.waiting #pbar i{animation:pbar 1.1s linear infinite}
@keyframes pbar{to{left:100%}}
body.waiting .btn{pointer-events:none;opacity:.55}
body.waiting .btn.wait{opacity:1;display:inline-flex;align-items:center;justify-content:center;gap:8px}
body.waiting .btn.block.wait{display:flex}
.btn.wait .spin{width:16px;height:16px;flex:none;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;animation:spin .7s linear infinite;vertical-align:0}
.btn.ghost.wait .spin{border-color:rgba(27,47,110,.25);border-top-color:var(--navy)}
@keyframes spin{to{transform:rotate(360deg)}}
#slow{white-space:nowrap;position:fixed;left:50%;transform:translateX(-50%);top:62px;z-index:85;background:#111827;color:#fff;font-size:13.5px;padding:8px 12px;border-radius:10px;box-shadow:0 6px 24px rgba(0,0,0,.25);max-width:92vw}
@media(prefers-reduced-motion:reduce){body.waiting #pbar i{animation-duration:2.4s}.spin{animation-duration:1.6s}}

/* finishing overlay (approve > PDF > save > email) */
.finov{position:fixed;inset:0;z-index:95;background:rgba(17,24,39,.55);display:flex;align-items:center;justify-content:center;padding:16px}
.finbox{background:#fff;border-radius:14px;padding:20px 22px;width:100%;max-width:360px;box-shadow:0 12px 40px rgba(0,0,0,.3)}
.finbox h2{margin:0 0 2px}.finbox .hint{margin:0}
.fintrack{height:6px;border-radius:3px;background:#e6eaf2;margin:12px 0 6px;overflow:hidden}
.fintrack i{display:block;height:100%;width:0;background:var(--blue);transition:width .4s}
.finst{display:flex;align-items:center;gap:10px;padding:7px 0;font-size:15px;color:#98a2b3}
.finst.now{color:var(--ink)}.finst.done{color:var(--ok)}
.finic{width:20px;height:20px;flex:none;border-radius:50%;border:2px solid #d0d5dd;display:flex;align-items:center;justify-content:center;font-size:13px;line-height:1}
.finst.now .finic{border-color:#c9d6f5;border-top-color:var(--blue);animation:spin .7s linear infinite}
.finst.done .finic{border-color:var(--ok);background:var(--ok);color:#fff}

/* the tab bar and the trainer's "needs your action" strip stay under the header while the page scrolls */
#tabs{position:sticky;top:var(--toph,50px);z-index:19}
#tabs .tabs{position:static}
.pend{position:sticky;top:var(--toph,50px);z-index:19;background:#fff;border-bottom:1px solid var(--line)}
.pend.has{background:#eef3ff;border-bottom-color:#c9d6f5}
.pendh{display:flex;align-items:center;gap:10px;max-width:1180px;margin:0 auto;padding:2px 12px}
.pendt{flex:1;display:flex;align-items:center;gap:8px;text-align:left;border:0;background:none;font-weight:700;font-size:14px;color:var(--navy);padding:8px 0;min-width:0}
.pendt:disabled{color:var(--mute);font-weight:600}
.pendt em{font-style:normal;flex:none;min-width:22px;height:22px;line-height:22px;border-radius:11px;background:#98a2b3;color:#fff;text-align:center;font-size:12.5px;padding:0 6px}
.pend.has .pendt em{background:var(--err)}
.pendl{max-width:1180px;margin:0 auto;padding:0 12px 8px;max-height:50vh;overflow:auto}

.aibox{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.aibox .btn{width:100%}
.aibox .hint{margin:8px 0 0}
.seg button{min-width:44px}

/* landing page: Trainer | Student */
.wrap.narrow{max-width:520px}
.ltabs{display:flex;background:#e3e8f2;border-radius:12px;padding:4px;margin:4px 0 14px}
.ltabs button{flex:1;border:0;background:none;border-radius:9px;padding:12px 8px;font-size:16px;font-weight:700;color:var(--mute);min-height:48px}
.ltabs button.on{background:#fff;color:var(--navy);box-shadow:0 1px 3px rgba(16,24,40,.18)}

/* ---- job steps: one card per step, compact risk row ---- */
.step-h{align-items:center;padding:6px 6px 6px 10px}
.step-h .num{margin-top:0}
.step-h .of{flex:1;font-weight:700;color:var(--navy);font-size:14px}
.step-b>label:first-child{margin-top:8px}
.step-b>textarea:first-of-type{font-weight:600}
.rr{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;margin-top:8px}
.rr .arr{color:var(--mute);font-size:18px}
.risk{padding:5px 6px 5px 10px;min-height:44px;font-size:12.5px;line-height:1.2;color:var(--ink);font-weight:600}
.risk small{display:block;font-weight:400;color:var(--mute);font-size:11px}
.risk b{font-size:16px;min-width:40px;padding:5px 6px}
.risk.unset{border-style:dashed}.risk.unset b{font-size:13px;color:var(--blue);background:#eef3ff}
.addstep{margin:14px 0 0}
.sstrip{display:flex;gap:6px;overflow-x:auto;padding:8px 2px;position:sticky;top:calc(var(--toph,50px) + var(--tabh,42px));z-index:17;background:var(--bg);scrollbar-width:none}
.sstrip::-webkit-scrollbar{display:none}
.sstrip button{flex:none;min-width:36px;height:36px;border-radius:18px;border:1.5px solid #b9c2d6;background:#fff;font-weight:700;font-size:14px;color:var(--ink);padding:0 6px}
.sstrip button.ok{border-color:#8fd0a8;background:#eefaf2;color:#17683a}
.sstrip button.bad{border-color:#e9a3a3}
.sstrip button.on{background:var(--navy);border-color:var(--navy);color:#fff;box-shadow:0 0 0 3px rgba(27,47,110,.18)}
@media (max-width:959px){
  .pager{display:flex;align-items:flex-start;gap:12px;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;overscroll-behavior-x:contain;scrollbar-width:none;transition:height .15s}
  .pager::-webkit-scrollbar{display:none}
  .pager>.step{flex:0 0 100%;scroll-snap-align:start;scroll-snap-stop:always;margin:0}
}
.bar .btn.ghost{flex:0 1 150px}
.risk *,.chip *,.sstrip button *{pointer-events:none}

.aicard{border-color:#c9d6f5}
.aif{list-style:none;margin:6px 0;padding:0}
.aif li{border-top:1px solid var(--line);padding:9px 0}.aif li:first-child{border-top:0}
.aif label{display:flex;gap:10px;align-items:flex-start;font-weight:400;color:var(--ink);margin:0;font-size:14.5px}
.aif input{width:22px;height:22px;flex:none;margin:1px 0 0}
.spin.dark{display:inline-block;width:14px;height:14px;border-radius:50%;border:2px solid rgba(27,47,110,.25);border-top-color:var(--navy);animation:spin .7s linear infinite;vertical-align:-2px;margin-right:6px}
.modal.urgent{background:rgba(16,24,40,.72)}.modal.urgent .sheet{border-top:6px solid var(--blue)}

var qrcode = function() {

  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);

        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;

        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;

      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      alt.text = alt.text || null;
      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      title.text = title.text || null;
      title.id = (title.text) ? title.id || 'qrcode-title' : null;

        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +
          escapeXml([title.id, alt.id].join(' ').trim() ) + '"' : '';
      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +
          escapeXml(alt.text) + '</description>' : '';
      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;

            mc = c*cellSize+margin;
            qrSvg += 'M' + mc + ',' + mr + rect;
          }
        }

      qrSvg += '" stroke="transparent" fill="black"/>';
      qrSvg += '</svg>';

      return qrSvg;
    };

    _this.createDataURL = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      return createDataURL(size, size, function(x, y) {
        if (min <= x && x < max && min <= y && y < max) {
          var c = Math.floor( (x - min) / cellSize);
          var r = Math.floor( (y - min) / cellSize);
          return _this.isDark(r, c)? 0 : 1;
        } else {
          return 1;
        }
      } );
    };

    _this.createImgTag = function(cellSize, margin, alt) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;

      var img = '';
      img += '<img';
      img += '\u0020src="';
      img += _this.createDataURL(cellSize, margin);
      img += '"';
      img += '\u0020width="';
      img += size;
      img += '"';
      img += '\u0020height="';
      img += size;
      img += '"';
      if (alt) {
        img += '\u0020alt="';
        img += escapeXml(alt);
        img += '"';
      }
      img += '/>';

      return img;
    };

    var escapeXml = function(s) {
      var escaped = '';
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charAt(i);
        switch(c) {
        case '<': escaped += '&lt;'; break;
        case '>': escaped += '&gt;'; break;
        case '&': escaped += '&amp;'; break;
        case '"': escaped += '&quot;'; break;
        default : escaped += c; break;
        }
      }
      return escaped;
    };

    var _createHalfASCII = function(margin) {
      var cellSize = 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r1, r2, p;

      var blocks = {
        '██': '█',
        '█ ': '▀',
        ' █': '▄',
        '  ': ' '
      };

      var blocksLastLineNoMargin = {
        '██': '▀',
        '█ ': '▀',
        ' █': ' ',
        '  ': ' '
      };

      var ascii = '';
      for (y = 0; y < size; y += 2) {
        r1 = Math.floor((y - min) / cellSize);
        r2 = Math.floor((y + 1 - min) / cellSize);
        for (x = 0; x < size; x += 1) {
          p = '█';

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r1, Math.floor((x - min) / cellSize))) {
            p = ' ';
          }

          if (min <= x && x < max && min <= y+1 && y+1 < max && _this.isDark(r2, Math.floor((x - min) / cellSize))) {
            p += ' ';
          }
          else {
            p += '█';
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          ascii += (margin < 1 && y+1 >= max) ? blocksLastLineNoMargin[p] : blocks[p];
        }

        ascii += '\n';
      }

      if (size % 2 && margin > 0) {
        return ascii.substring(0, ascii.length - size - 1) + Array(size+1).join('▀');
      }

      return ascii.substring(0, ascii.length-1);
    };

      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r, p;

      var white = Array(cellSize+1).join('██');
      var black = Array(cellSize+1).join('  ');

      var ascii = '';
      var line = '';
      for (y = 0; y < size; y += 1) {
        r = Math.floor( (y - min) / cellSize);
        line = '';
        for (x = 0; x < size; x += 1) {
          p = 1;

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r, Math.floor((x - min) / cellSize))) {
            p = 0;

/* Live channel to Firebase Realtime Database, using its plain REST interface (no Firebase library needed):
   one streaming connection per phone delivers every change in the crew's room the moment it happens,
   and each edit is a small write to the exact field that changed. */
function tSet(tree, path, val) {                      // path like "/draft/steps/abc/text"; null deletes

function newLive() {

  var base, room, tree = {}, es, cb, ready = false, queue = [], timer, last = '';
  function fire() { if (cb) cb(tree, ready); }
  function send(method, path, val) {
    if (demo) {

      function (e) { if (e.message !== 'locked') { queue = q.concat(queue); clearTimeout(timer); timer = setTimeout(drain, 4000); } });
  }

    var all = JSON.parse(localStorage.getItem(KEY) || '{}'), r = JSON.stringify((all.live || {})[room] || {});

  }

    open: function (r, f) {

      if (demo) { window.addEventListener('storage', demoRead); window.addEventListener('eimfb', demoRead); demoRead(); ready = true; fire(); return; }

  return new Promise(function (resolve) {
    var strokes = [], cur = null;

      (saved ? '<div class="card" style="margin:8px 0"><div class="lab" style="margin-top:0">Saved signature</div><div class="sig" style="width:200px;height:64px">' + sigSvg(saved) + '</div><button class="btn block" data-use>Use saved signature</button></div><p class="hint">or sign again:</p>' : '') +
      '<canvas class="pad" width="1000" height="320"></canvas>' +
      '<div class="acts"><button class="btn ghost" data-clear>Clear</button><button class="btn ghost" data-close>Cancel</button><button class="btn ok" data-done disabled>Sign</button></div>');
    var c = m.querySelector('canvas'), x = c.getContext('2d');
    x.lineWidth = 7; x.lineCap = 'round'; x.lineJoin = 'round'; x.strokeStyle = '#0a1a6b';
    function pt(e) { var r = c.getBoundingClientRect(); return [Math.round((e.clientX - r.left) / r.width * 1000), Math.round((e.clientY - r.top) / r.height * 320)]; }
    c.addEventListener('pointerdown', function (e) { e.preventDefault(); c.setPointerCapture(e.pointerId); var p = pt(e); cur = [p[0], p[1]]; strokes.push(cur); x.beginPath(); x.moveTo(p[0], p[1]); });

/* ---- finishing overlay: approving is the longest wait in the app (record the approval, build the PDF in this browser,

var FIN = null;
function finTimes() { try { return JSON.parse(store('jsea_fin_ms') || '[]').filter(function (x) { return x > 0; }); } catch (e) { return []; } }
function finOpen(labels) {

  var o = el('<div class="finov" role="alertdialog" aria-live="polite"><div class="finbox"><h2>Finishing the JSEA</h2><p class="hint">' +
    (avg ? 'This usually takes about ' + secs + ' seconds. ' : '') + 'Keep this page open.</p><div class="fintrack"><i></i></div>' +
    labels.map(function (l) { return '<div class="finst"><span class="finic"></span><span>' + h(l) + '</span></div>'; }).join('') + '</div></div>');

  FIN.o.querySelector('.fintrack i').style.width = Math.round(i / FIN.labels.length * 100) + '%';

function finClose(ok) {

  if (ok && f.full) { var t = finTimes(); t.push(Date.now() - f.at); store('jsea_fin_ms', JSON.stringify(t.slice(-5))); }

      l.href = url; l.download = (d.session.unit + '_' + d.session.assess + '_JSEA_' + (d.crewName || d.members[0].name) + (d.status === 'approved' ? '' : '_DRAFT') + '.pdf').replace(/\s+/g, '_'); document.body.appendChild(l); l.click(); l.remove(); G.lastPdfUrl = url; toast('PDF downloaded.', 'good');
    }, fail); }
  else if (a === 'tSend') sendPdf();
}
